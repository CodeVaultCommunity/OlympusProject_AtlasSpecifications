[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-spec"
version = "1.0.0"
description = "Translator and validator for Atlas Specifications Stable-v1.0.0"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Douglas de Oliveira Alkimim"}]
dependencies = ["jsonschema>=4.20,<5"]

[project.optional-dependencies]
test = ["pytest>=8.0", "setuptools>=77", "wheel"]
assets = ["Pillow>=10.0", "CairoSVG>=2.7,<3"]

[project.scripts]
atlas-spec = "atlas_spec.cli:main"

[tool.setuptools.packages.find]
where = ["translator/src"]

[tool.setuptools.package-data]
atlas_spec = ["schemas/*.json", "templates/*.sty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
